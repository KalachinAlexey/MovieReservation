name: movie-reservation-test

services:
  postgres:
    image: postgres:17
    restart: "no"
    environment:
      POSTGRES_DB: "movie_test"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_PORT: "5432"
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "port=5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d movie_test" ]
      interval: 10s
      timeout: 5s
      retries: 5
