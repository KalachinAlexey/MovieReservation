spring.application.name=authorization

server.port=9000

spring.datasource.url=jdbc:h2:file:./data/authdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.authorizationserver.issuer=http://localhost:9000

spring.security.oauth2.authorizationserver.client.cinema-frontend.registration.client-id=cinema-frontend
spring.security.oauth2.authorizationserver.client.cinema-frontend.registration.client-authentication-methods[0]=none
spring.security.oauth2.authorizationserver.client.cinema-frontend.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.cinema-frontend.registration.redirect-uris[0]=http://localhost:5173/oauth/callback
spring.security.oauth2.authorizationserver.client.cinema-frontend.registration.post-logout-redirect-uris[0]=http://localhost:5173
spring.security.oauth2.authorizationserver.client.cinema-frontend.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.cinema-frontend.registration.scopes[1]=profile

spring.security.oauth2.authorizationserver.client.cinema-frontend.require-proof-key=true
spring.security.oauth2.authorizationserver.client.cinema-frontend.require-authorization-consent=false
spring.security.oauth2.authorizationserver.client.cinema-frontend.token.access-token-time-to-live=15m
spring.security.oauth2.authorizationserver.client.cinema-frontend.token.authorization-code-time-to-live=2m

app.security.jwt.private-key=${AUTH_PRIVATE_KEY:file:./secrets/authz.pem}
app.security.jwt.public-key=${AUTH_PUBLIC_KEY:file:./secrets/authz.pub}
app.security.jwt.key-id=${AUTH_KEY_ID:cinema-key-2026-01}

app.security.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}